name: vol_web
description: VÔL Network web app.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.9.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  file_picker: ^11.0.3
  desktop_drop: ^0.8.4
  collection: ^1.19.1
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/nav/
    - assets/illustrations/
    - assets/avatars/
